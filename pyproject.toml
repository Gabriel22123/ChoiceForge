[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-model"
version = "0.1.0a18"
description = "ChoiceForge: task-conditioned candidate decisions with fixed structured outputs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
data = ["jsonschema==4.25.1", "pyarrow>=21,<22"]
model = ["torch>=2.6,<3", "transformers>=5.3,<6", "peft>=0.18,<1", "safetensors>=0.5,<1", "numpy>=1.26"]
dev = ["build>=1.2"]

[project.scripts]
decision-model = "decision_model.cli:main"
choiceforge = "decision_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_model = ["base.lock.json", "decoder_base.lock.json", "schemas/*.json"]
